---
- name: Setup AI environment (user-based, AlmaLinux)
  hosts: all
  become: yes

  vars:
    user_name: "{{ ansible_user }}"
    user_home: "/home/{{ user_name }}"
    project_dir: "{{ user_home }}/ai_files"
    venv_dir: "{{ project_dir }}/venv"
    python_bin: /usr/bin/python3.11

  tasks:

    # System dependencies
    - name: Install base packages
      dnf:
        name:
          - gcc
          - make
          - curl
          - git
          - redhat-rpm-config
          - rrdtool
          - rrdtool-devel
          - python3.11
          - python3.11-devel
          - python3.11-pip
        state: present

    # Create project directory (owned by user)
    - name: Create project directory
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: '0755'

    # Create virtual environment
    - name: Create virtual environment
      become: false
      command: "{{ python_bin }} -m venv {{ venv_dir }}"
      args:
        creates: "{{ venv_dir }}"

    - name: Upgrade pip
      become: false
      command: "{{ venv_dir }}/bin/pip install --upgrade pip"

    # Install Python packages
    - name: Install Python dependencies
      become: false
      pip:
        virtualenv: "{{ venv_dir }}"
        name:
          - pydantic-ai
          - langchain-core
          - langgraph
          - rrdtool

    # Install Ollama
    - name: Install Ollama
      shell: curl -fsSL https://ollama.com/install.sh | sh
      args:
        creates: /usr/local/bin/ollama

    - name: Enable and start Ollama
      systemd:
        name: ollama
        state: started
        enabled: yes

    # Pull Qwen model
    - name: Pull Qwen model
      command: ollama pull qwen3:latest
